name: Baseline Scholarship Notice Crawl

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # 07:30 KST every Monday
    - cron: "30 22 * * 0"

jobs:
  baseline-crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply unified source tuning
        run: |
          npm run tune:cau-notices
          npm run tune:ewha-notices
          npm run tune:hongik-notices
          npm run tune:hanyang-notices
          npm run tune:khu-notices
          npm run tune:korea-notices
          npm run tune:skku-notices
          npm run tune:uos-notices
          npm run tune:yonsei-notices
          npm run merge:notice-sources

      - name: Reset baseline state
        run: |
          mkdir -p .crawler
          rm -f .crawler/cau-baseline-state.json .crawler/ewha-baseline-state.json .crawler/hanyang-baseline-state.json .crawler/hongik-baseline-state.json .crawler/khu-baseline-state.json .crawler/korea-baseline-state.json .crawler/skku-baseline-state.json .crawler/uos-baseline-state.json .crawler/yonsei-baseline-state.json

      - name: Run CAU baseline crawl
        env:
          CRAWL_LOOKBACK_DAYS: "31"
          CRAWL_ALLOW_UNDATED: "true"
          CRAWL_SOURCE_CONCURRENCY: "8"
          CRAWL_SOURCE_ID_PREFIX: "cau_"
        run: node scripts/crawl-scholarship-notices.mjs data/notice-sources.csv exports/notices/cau-baseline .crawler/cau-baseline-state.json

      - name: Clean CAU baseline crawl
        run: |
          TODAY=$(date +%Y%m%d)
          if [ -f "exports/notices/cau-baseline/scholarship-notices-new-${TODAY}.csv" ]; then
            node scripts/clean-crawled-notices.mjs \
              "exports/notices/cau-baseline/scholarship-notices-new-${TODAY}.csv" \
              "exports/notices/cau-baseline/scholarship-notices-latest.cleaned.csv" \
              "exports/notices/cau-baseline/scholarship-notices-latest.rejected.csv"
          else
            echo "skip=missing_cau_baseline_csv"
          fi

      - name: Run Ewha baseline crawl
        env:
          CRAWL_LOOKBACK_DAYS: "31"
          CRAWL_ALLOW_UNDATED: "true"
          CRAWL_SOURCE_CONCURRENCY: "4"
          CRAWL_SOURCE_ID_PREFIX: "ewha_"
        run: node scripts/crawl-scholarship-notices.mjs data/notice-sources.csv exports/notices/ewha-baseline .crawler/ewha-baseline-state.json

      - name: Clean Ewha baseline crawl
        run: |
          TODAY=$(date +%Y%m%d)
